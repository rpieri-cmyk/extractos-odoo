# Requiere: a2enmod proxy proxy_http
# Dentro del <VirtualHost> del sitio.
ProxyPreserveHost On
ProxyTimeout 120
LimitRequestBody 26214400

# En la raíz del dominio:
ProxyPass        / http://127.0.0.1:3000/
ProxyPassReverse / http://127.0.0.1:3000/

# O bajo una subruta:
# ProxyPass        /extractos/ http://127.0.0.1:3000/
# ProxyPassReverse /extractos/ http://127.0.0.1:3000/
